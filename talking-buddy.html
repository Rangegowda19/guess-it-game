<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinnu — Talking Buddy & GK Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF4FF; --card:#FFFFFF; --ink:#22315C; --ink-soft:#6B7AA8;
    --sun:#FFB020; --grape:#7C5CFC; --leaf:#2FBF71; --berry:#FF6B7A;
    --sky:#4FA8F5; --shadow:0 8px 0 rgba(34,49,92,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; background:var(--bg);
    background-image:radial-gradient(#fff 18%, transparent 19%), radial-gradient(#fff 18%, transparent 19%);
    background-size:46px 46px; background-position:0 0,23px 23px;
    font-family:"Nunito","Segoe UI",system-ui,sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; padding:16px;
  }
  h1,.btn,.opt,.mode{font-family:"Baloo 2","Nunito",sans-serif;}
  h1{font-size:clamp(26px,5vw,40px); margin:8px 0 2px; font-weight:800;}
  h1 .dot{color:var(--berry);}
  .tag{color:var(--ink-soft); font-weight:800; margin:0 0 18px; font-size:15px;}
  .screen{width:100%; max-width:520px; display:none; flex-direction:column; align-items:center;}
  .screen.on{display:flex;}
  .stage{background:var(--card); width:100%; border-radius:28px; padding:26px 18px 22px; box-shadow:var(--shadow); text-align:center; position:relative; overflow:hidden;}

  /* menu */
  .modes{display:grid; gap:14px; width:100%;}
  .mode{background:var(--card); border:none; border-radius:22px; padding:24px 12px 18px; box-shadow:var(--shadow); cursor:pointer; font-size:21px; font-weight:800; color:var(--ink); transition:transform .12s;}
  .mode:active{transform:scale(.96);}
  .mode span{display:block; font-size:56px; margin-bottom:6px;}
  .mode small{display:block; font-family:"Nunito"; font-size:14px; color:var(--ink-soft); font-weight:800; margin-top:4px;}

  .topbar{display:flex; width:100%; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .pill{background:#fff; border-radius:999px; padding:6px 14px; font-weight:800; box-shadow:var(--shadow); font-size:15px;}
  .pill.stars{color:var(--sun);}
  .home{border:none; background:#fff; border-radius:999px; width:40px; height:40px; font-size:18px; cursor:pointer; box-shadow:var(--shadow);}

  /* ---------- talking buddy ---------- */
  .buddy{
    font-size:clamp(120px,38vw,180px); line-height:1.1; user-select:none; cursor:pointer;
    display:inline-block; transition:transform .15s;
    filter:drop-shadow(0 8px 0 rgba(34,49,92,.10));
  }
  .buddy.listening{animation:lean 0.8s ease-in-out infinite;}
  .buddy.talking{animation:jabber 0.22s ease-in-out infinite;}
  .buddy.happy{animation:bounce 0.5s ease;}
  @keyframes lean{0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(4deg);}}
  @keyframes jabber{0%,100%{transform:scaleY(1);} 50%{transform:scaleY(0.88) scaleX(1.05);}}
  @keyframes bounce{0%,100%{transform:translateY(0);} 40%{transform:translateY(-24px);} 70%{transform:translateY(0) scaleY(.92);}}
  .speech{min-height:26px; font-weight:800; color:var(--ink-soft); font-size:16px; margin:6px 0;}
  .talkbtn{
    width:100%; border:none; border-radius:20px; padding:18px; font-size:22px; font-weight:800;
    font-family:"Baloo 2"; color:#fff; background:var(--berry); box-shadow:0 8px 0 #d84b5b;
    cursor:pointer; transition:transform .1s; margin-top:10px;
  }
  .talkbtn:active{transform:translateY(4px); box-shadow:0 4px 0 #d84b5b;}
  .talkbtn.rec{background:var(--leaf); box-shadow:0 8px 0 #1e9457; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.03);}}
  .minirow{display:flex; gap:10px; margin-top:12px;}
  .mini{flex:1; border:none; border-radius:16px; padding:12px; font-size:16px; font-weight:800; font-family:"Baloo 2"; cursor:pointer; color:#fff; box-shadow:var(--shadow);}
  .mini.tickle{background:var(--sun);} .mini.hello{background:var(--sky);} .mini.sing{background:var(--grape);}

  /* ---------- quiz ---------- */
  .question{font-weight:800; font-size:clamp(19px,4.5vw,24px); margin:2px 0 14px; font-family:"Baloo 2";}
  .opts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%;}
  .opt{border:none; background:#F2F5FF; color:var(--ink); border-radius:18px; padding:14px 6px; font-size:17px; font-weight:800; cursor:pointer; box-shadow:0 4px 0 rgba(34,49,92,.10); transition:transform .1s;}
  .opt span{display:block; font-size:44px; margin-bottom:4px;}
  .opt:active{transform:scale(.95);}
  .opt.right{background:var(--leaf); color:#fff;}
  .opt.wrong{background:var(--berry); color:#fff;}
  .fb{min-height:30px; font-size:19px; font-weight:800; margin:10px 0 0;}
  .fb.good{color:var(--leaf);} .fb.try{color:var(--sun);} .fb.ans{color:var(--berry);}
  .rowbtns{display:flex; gap:10px; margin-top:14px; width:100%;}
  .btn{flex:1; border:none; border-radius:16px; padding:13px; font-size:17px; font-weight:800; cursor:pointer; color:#fff; box-shadow:var(--shadow); transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn.repeat{background:var(--sky);} .btn.next{background:var(--grape);}
  .micline{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px;}
  .micsm{width:58px; height:58px; border-radius:50%; border:none; cursor:pointer; background:var(--berry); color:#fff; font-size:26px; box-shadow:0 6px 0 #d84b5b;}
  .micsm.listening{background:var(--leaf); box-shadow:0 6px 0 #1e9457; animation:pulse 1s infinite;}
  .heard{font-size:14px; font-weight:800; color:var(--sky); min-height:18px;}

  .cf{position:absolute; top:-10px; font-size:22px; animation:fall 1.4s ease-in forwards; pointer-events:none;}
  @keyframes fall{to{transform:translateY(420px) rotate(360deg); opacity:0;}}
  .trophy{font-size:96px; margin:10px 0;}
  .score-big{font-size:26px; font-weight:800; margin:4px 0 16px; font-family:"Baloo 2";}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
<h1>Chinnu<span class="dot">!</span></h1>
<p class="tag">Your talking friend 🐱 · Fun questions 🧠</p>

<!-- ============ MENU ============ -->
<section class="screen on" id="menu">
  <div class="modes">
    <button class="mode" data-go="tom"><span>🐱</span>Talking Buddy<small>Say anything — Chinnu repeats it in a funny voice!</small></button>
    <button class="mode" data-go="quiz"><span>🧠</span>GK Quiz<small>Easy questions for little champions (age 4–6)</small></button>
  </div>
</section>

<!-- ============ TALKING BUDDY ============ -->
<section class="screen" id="tom">
  <div class="topbar">
    <button class="home" data-go="menu">🏠</button>
    <div class="pill">Talking Buddy</div>
    <div style="width:40px"></div>
  </div>
  <div class="stage">
    <div class="buddy" id="buddy">🐱</div>
    <div class="speech" id="buddySpeech">Tap the big button and talk to me!</div>
    <button class="talkbtn" id="talkBtn">🎤 Hold on… Tap to Talk!</button>
    <div class="minirow">
      <button class="mini hello" id="helloBtn">👋 Hello</button>
      <button class="mini tickle" id="tickleBtn">🪶 Tickle</button>
      <button class="mini sing" id="singBtn">🎵 Sing</button>
    </div>
  </div>
</section>

<!-- ============ QUIZ ============ -->
<section class="screen" id="quiz">
  <div class="topbar">
    <button class="home" data-go="menu">🏠</button>
    <div class="pill" id="qProgress">1 / 8</div>
    <div class="pill stars" id="qStars">⭐ 0</div>
  </div>
  <div class="stage">
    <p class="question" id="qText">What colour is the sky?</p>
    <div class="opts" id="qOpts"></div>
    <div class="micline">
      <button class="micsm" id="qMic">🎤</button>
      <div>
        <div class="heard" id="qHeard"></div>
        <div class="heard" style="color:var(--ink-soft)" id="qMicLabel">or say your answer!</div>
      </div>
    </div>
    <div class="fb" id="qFb"></div>
    <div class="rowbtns">
      <button class="btn repeat" id="qRepeat">🔊 Hear again</button>
      <button class="btn next" id="qSkip">Skip ➜</button>
    </div>
  </div>
</section>

<!-- ============ END ============ -->
<section class="screen" id="end">
  <div class="stage">
    <div class="trophy" id="trophyEmoji">🏆</div>
    <div class="score-big" id="finalScore"></div>
    <div class="fb good" id="finalMsg"></div>
    <div class="rowbtns">
      <button class="btn repeat" id="againBtn">🔁 Play again</button>
      <button class="btn next" data-go="menu">🏠 Menu</button>
    </div>
  </div>
</section>

<script>
/* ================= NAV ================= */
const $ = id => document.getElementById(id);
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $(id).classList.add("on"); }
document.querySelectorAll("[data-go]").forEach(b=> b.onclick = ()=>{
  speechSynthesis.cancel();
  const to = b.dataset.go;
  if(to==="quiz") startQuiz(); else show(to);
});

/* ================= SPEECH OUT ================= */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]IN/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || vs[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function say(text, opts={}, cb){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(voice) u.voice = voice;
    u.rate = opts.rate ?? 0.92; u.pitch = opts.pitch ?? 1.1;
    if(cb) u.onend = cb;
    speechSynthesis.speak(u);
  }catch(e){ if(cb) cb(); }
}

/* =================================================
   TALKING BUDDY — record child's voice, replay pitched up
   ================================================= */
let audioCtx = null, mediaStream = null, recorder = null, chunks = [];
let recording = false;

function buddyState(cls){
  const b = $("buddy");
  b.className = "buddy" + (cls ? " "+cls : "");
}

async function getMic(){
  if(mediaStream) return mediaStream;
  mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
  return mediaStream;
}

$("talkBtn").onclick = async ()=>{
  if(recording){ recorder.stop(); return; }
  try{
    const stream = await getMic();
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = playBackFunny;
    recorder.start();
    recording = true;
    $("talkBtn").textContent = "🟢 I'm listening… Tap when done!";
    $("talkBtn").classList.add("rec");
    $("buddySpeech").textContent = "Chinnu is listening… 👂";
    buddyState("listening");
  }catch(err){
    $("buddySpeech").textContent = "I can't hear 😿 — please allow the microphone!";
  }
};

async function playBackFunny(){
  recording = false;
  $("talkBtn").textContent = "🎤 Tap to Talk!";
  $("talkBtn").classList.remove("rec");
  const blob = new Blob(chunks, {type: recorder.mimeType || "audio/webm"});
  if(blob.size < 800){ buddyState(""); $("buddySpeech").textContent = "I didn't hear anything — try again!"; return; }
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") await audioCtx.resume();
    const buf = await audioCtx.decodeAudioData(await blob.arrayBuffer());
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 1.6;          /* ← chipmunk voice! */
    src.connect(audioCtx.destination);
    buddyState("talking");
    $("buddySpeech").textContent = "Hee hee! Listen to me! 😸";
    src.onended = ()=>{ buddyState("happy"); setTimeout(()=>buddyState(""), 600); $("buddySpeech").textContent = "Talk to me again!"; };
    src.start();
  }catch(e){
    buddyState("");
    $("buddySpeech").textContent = "Oops, something went wrong — try again!";
  }
}

/* poke buttons */
$("buddy").onclick = ()=>{ buddyState("happy"); setTimeout(()=>buddyState(""),600); say("Hee hee!", {pitch:1.8, rate:1.15}); };
$("helloBtn").onclick = ()=>{ buddyState("talking"); say("Hello my friend! I am Chinnu the cat! What is your name?", {pitch:1.7, rate:1.05}, ()=>buddyState("")); };
$("tickleBtn").onclick = ()=>{ buddyState("happy"); say("He he he he! That tickles! Stop it, stop it!", {pitch:1.9, rate:1.25}, ()=>buddyState("")); setTimeout(()=>buddyState(""),700); };
$("singBtn").onclick = ()=>{ buddyState("talking"); say("La la la la laaa! Twinkle twinkle little star, how I wonder what you are! Meow!", {pitch:1.8, rate:1.0}, ()=>buddyState("")); };

/* =================================================
   GK QUIZ — basic questions for ~5 year olds
   ================================================= */
const GK = [
  {q:"What colour is the sky?", a:"blue", syn:["neela"], opts:[["Blue","🔵"],["Red","🔴"],["Green","🟢"]]},
  {q:"What colour is a banana?", a:"yellow", syn:["peela"], opts:[["Yellow","🟡"],["Purple","🟣"],["Black","⚫"]]},
  {q:"What colour is grass?", a:"green", syn:["hara"], opts:[["Green","🟢"],["Pink","🩷"],["Blue","🔵"]]},
  {q:"What colour is a tomato?", a:"red", syn:["lal"], opts:[["Red","🔴"],["Blue","🔵"],["White","⚪"]]},
  {q:"What colour is milk?", a:"white", syn:["safed"], opts:[["White","⚪"],["Green","🟢"],["Orange","🟠"]]},
  {q:"Which animal says moo?", a:"cow", syn:["gai"], opts:[["Cow","🐮"],["Cat","🐱"],["Duck","🦆"]]},
  {q:"Which animal says meow?", a:"cat", syn:["billi","kitty"], opts:[["Cat","🐱"],["Dog","🐶"],["Lion","🦁"]]},
  {q:"Which animal says woof woof?", a:"dog", syn:["doggy","kutta","puppy"], opts:[["Dog","🐶"],["Fish","🐟"],["Hen","🐔"]]},
  {q:"Which animal has a long trunk?", a:"elephant", syn:["hathi"], opts:[["Elephant","🐘"],["Rabbit","🐰"],["Monkey","🐵"]]},
  {q:"Which animal can fly?", a:"bird", syn:["birds","chidiya","parrot"], opts:[["Bird","🐦"],["Cow","🐮"],["Fish","🐟"]]},
  {q:"Where do fish live?", a:"water", syn:["in water","sea","river","pani"], opts:[["Water","💧"],["Tree","🌳"],["Sky","☁️"]]},
  {q:"How many legs does a dog have?", a:"four", syn:["4","for"], opts:[["Four","4️⃣"],["Two","2️⃣"],["Six","6️⃣"]]},
  {q:"How many eyes do you have?", a:"two", syn:["2","to","too"], opts:[["Two","2️⃣"],["Five","5️⃣"],["One","1️⃣"]]},
  {q:"How many fingers are on one hand?", a:"five", syn:["5"], opts:[["Five","5️⃣"],["Three","3️⃣"],["Ten","🔟"]]},
  {q:"What do bees make?", a:"honey", syn:["shahad"], opts:[["Honey","🍯"],["Milk","🥛"],["Bread","🍞"]]},
  {q:"What do cows give us?", a:"milk", syn:["doodh"], opts:[["Milk","🥛"],["Eggs","🥚"],["Honey","🍯"]]},
  {q:"What shape is a ball?", a:"round", syn:["circle","gol"], opts:[["Round","⚽"],["Square","🟦"],["Star","⭐"]]},
  {q:"When do we see the sun?", a:"day", syn:["daytime","morning","din"], opts:[["Day","☀️"],["Night","🌙"],["Never","🙈"]]},
  {q:"When do we see the stars?", a:"night", syn:["at night","raat"], opts:[["Night","🌙"],["Day","☀️"],["Lunch time","🍱"]]},
  {q:"What do we brush every morning?", a:"teeth", syn:["tooth","daant"], opts:[["Teeth","🦷"],["Shoes","👟"],["Hair? No — teeth!","😁"]]},
  {q:"What do we use to see?", a:"eyes", syn:["eye","aankh"], opts:[["Eyes","👀"],["Ears","👂"],["Nose","👃"]]},
  {q:"Which fruit is long and yellow?", a:"banana", syn:["kela"], opts:[["Banana","🍌"],["Apple","🍎"],["Grapes","🍇"]]},
  {q:"What falls from clouds when it rains?", a:"water", syn:["rain","raindrops","barish","pani"], opts:[["Water","🌧️"],["Toys","🧸"],["Candy","🍬"]]},
  {q:"Which one is very hot?", a:"sun", syn:["the sun","suraj"], opts:[["Sun","☀️"],["Ice","🧊"],["Moon","🌙"]]},
];
const ROUND_LEN = 8;
const PRAISE = ["Great job!","Super!","You got it!","Wonderful!","Correct!","Fantastic!"];
const TRY_AGAIN = ["Good try! Try once more.","Almost! Think again.","Nice try! One more time."];

let qItems=[], qIdx=0, qStars=0, qAttempts=0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim();}
function lev(a,b){
  const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];
}
function qMatch(heard, item){
  const words=[item.a,...(item.syn||[])].map(norm), h=norm(heard);
  if(!h) return false;
  for(const w of words){
    if(h===w || h.includes(w)) return true;
    const tol = w.length>=6?2 : w.length>=4?1 : 0;
    for(const t of h.split(" ")) if(lev(t,w)<=tol) return true;
  }
  return false;
}

function startQuiz(){
  qItems = shuffle([...GK]).slice(0, ROUND_LEN);
  qIdx=0; qStars=0;
  show("quiz");
  nextQ();
}
function nextQ(){
  if(qIdx>=qItems.length) return endQuiz();
  qAttempts=0;
  const it=qItems[qIdx];
  $("qProgress").textContent=(qIdx+1)+" / "+qItems.length;
  $("qStars").textContent="⭐ "+qStars;
  $("qText").textContent=it.q;
  $("qFb").textContent=""; $("qFb").className="fb"; $("qHeard").textContent="";
  const box=$("qOpts"); box.innerHTML="";
  shuffle([...it.opts]).forEach(([label,emoji])=>{
    const b=document.createElement("button");
    b.className="opt"; b.innerHTML="<span>"+emoji+"</span>"+label;
    b.onclick=()=>qCheck(label,b);
    box.appendChild(b);
  });
  say(it.q);
}
$("qRepeat").onclick=()=> say(qItems[qIdx].q);
$("qSkip").onclick=()=> qReveal(true);

function qCheck(heard, btn){
  const it=qItems[qIdx];
  if(qMatch(heard,it)){
    if(btn) btn.classList.add("right");
    qStars++; $("qStars").textContent="⭐ "+qStars;
    const p=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    $("qFb").textContent="🎉 "+p; $("qFb").className="fb good";
    confetti();
    say(p+" The answer is "+it.a+"!", {}, ()=>setTimeout(qAdvance,300));
  }else{
    qAttempts++;
    if(btn){ btn.classList.add("wrong"); setTimeout(()=>btn.classList.remove("wrong"),700); }
    if(qAttempts<2){
      const t=TRY_AGAIN[Math.floor(Math.random()*TRY_AGAIN.length)];
      $("qFb").textContent="💛 "+t; $("qFb").className="fb try";
      say(t);
    }else qReveal(false);
  }
}
function qReveal(skipped){
  const it=qItems[qIdx];
  $("qFb").textContent="The answer is: "+it.a+"!";
  $("qFb").className="fb ans";
  say((skipped?"":"Good try! ")+"The answer is "+it.a+"!", {}, ()=>setTimeout(qAdvance,900));
}
function qAdvance(){ qIdx++; nextQ(); }

function endQuiz(){
  show("end");
  const pct=qStars/qItems.length;
  $("trophyEmoji").textContent = pct>=0.8?"🏆":pct>=0.5?"🌟":"💪";
  $("finalScore").textContent="You got "+qStars+" out of "+qItems.length+" stars!";
  const msg = pct>=0.8?"Amazing! You're a superstar!":pct>=0.5?"Great work! Keep practicing!":"Good effort! Let's play again!";
  $("finalMsg").textContent=msg;
  say("You got "+qStars+" stars! "+msg);
}
$("againBtn").onclick=()=> startQuiz();

/* quiz voice input */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let qRec=null, qListening=false;
if(SR){
  qRec=new SR(); qRec.lang="en-IN"; qRec.interimResults=true; qRec.maxAlternatives=4;
  qRec.onresult=e=>{
    let txt=""; for(const r of e.results) txt+=r[0].transcript+" ";
    $("qHeard").textContent="I heard: “"+txt.trim()+"”";
    const last=e.results[e.results.length-1];
    if(last.isFinal) qCheck([...last].map(a=>a.transcript).join(" "));
  };
  qRec.onend=()=>{ qListening=false; $("qMic").classList.remove("listening"); };
  qRec.onerror=()=>{ qListening=false; $("qMic").classList.remove("listening"); $("qMicLabel").textContent="Mic not working — tap an answer!"; };
}else{
  $("qMicLabel").textContent="Mic not available — tap an answer!";
}
$("qMic").onclick=()=>{
  if(!qRec) return;
  if(qListening){ qRec.stop(); return; }
  $("qHeard").textContent=""; qListening=true; $("qMic").classList.add("listening");
  try{ qRec.start(); }catch(e){ qListening=false; $("qMic").classList.remove("listening"); }
};

function confetti(){
  const stage=document.querySelector(".screen.on .stage");
  if(!stage) return;
  const bits=["🎉","⭐","🎊","✨","🌟"];
  for(let i=0;i<12;i++){
    const s=document.createElement("span");
    s.className="cf"; s.textContent=bits[Math.floor(Math.random()*bits.length)];
    s.style.left=(5+Math.random()*90)+"%";
    s.style.animationDelay=(Math.random()*0.4)+"s";
    stage.appendChild(s);
    setTimeout(()=>s.remove(),2000);
  }
}
</script>
</body>
</html>
